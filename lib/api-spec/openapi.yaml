openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: zoho
    description: Zoho Books connection operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /integrations/zoho/status:
    get:
      operationId: getZohoConnectionStatus
      tags: [zoho]
      summary: Get the signed-in user's Zoho Books connection status
      responses:
        "200":
          description: Current connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoConnectionStatus"
        "401":
          description: Not authenticated
  /integrations/zoho/invoices:
    get:
      operationId: listZohoInvoices
      tags: [zoho]
      summary: List invoices imported from the signed-in user's Zoho Books account
      responses:
        "200":
          description: Imported invoices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZohoInvoice"
        "401":
          description: Not authenticated
  /integrations/zoho/sync:
    post:
      operationId: syncZohoInvoices
      tags: [zoho]
      summary: Refresh invoices from the signed-in user's Zoho Books account
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoSyncResult"
        "401":
          description: Not authenticated
        "409":
          description: Zoho Books is not connected
  /integrations/zoho/demo:
    post:
      operationId: connectZohoDemo
      tags: [zoho]
      summary: Connect a prototype Zoho Books workspace with realistic sample invoices
      responses:
        "200":
          description: Demo workspace connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoConnectionStatus"
        "401":
          description: Not authenticated
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ZohoConnectionStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        organizationId:
          type: ["string", "null"]
        organizationName:
          type: ["string", "null"]
    ZohoInvoice:
      type: object
      required: [invoiceId, invoiceNumber, customerName, status, invoiceDate, total, balance, currencyCode, syncedAt]
      properties:
        invoiceId:
          type: string
        invoiceNumber:
          type: string
        customerName:
          type: string
        description:
          type: ["string", "null"]
        status:
          type: string
        invoiceDate:
          type: string
        dueDate:
          type: ["string", "null"]
        total:
          type: string
        balance:
          type: string
        currencyCode:
          type: string
        syncedAt:
          type: string
          format: date-time
    ZohoSyncResult:
      type: object
      required: [syncedCount, syncedAt]
      properties:
        syncedCount:
          type: integer
        syncedAt:
          type: string
          format: date-time

