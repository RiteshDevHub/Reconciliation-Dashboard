openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: zoho
    description: Zoho Books connection operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /integrations/zoho/status:
    get:
      operationId: getZohoConnectionStatus
      tags: [zoho]
      summary: Get the signed-in user's Zoho Books connection status
      responses:
        "200":
          description: Current connection state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZohoConnectionStatus"
        "401":
          description: Not authenticated
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ZohoConnectionStatus:
      type: object
      required: [connected]
      properties:
        connected:
          type: boolean
        organizationId:
          type: ["string", "null"]
        organizationName:
          type: ["string", "null"]

